name: Build and Package Fyne App

on:
  push:
    branches: [ main, dev ]
#   pull_request:
#     branches: [ main, dev ]
#   workflow_dispatch: # Allows manual triggers

jobs:
  build:
    runs-on: darwin-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Adjust to match your go.mod
          cache: true

      - name: Install Fyne CLI and Fyne-cross
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install github.com/fyne-io/fyne-cross@latest
      - name: Download macOS SDK
        run: |
          mkdir -p sdk
          # Download a compatible macOS SDK (e.g., 11.3, 13.3, or 14.0 depending on your needs)
          curl -L https://github.com | tar -xJ -C sdk

      - name: Build with Fyne-cross
        run: |
          fyne-cross darwin -macosx-sdk-path=$GITHUB_WORKSPACE/sdk/MacOSX11.3.sdk -release -app-id "com.github.parol" -name "myapp" -icon "ui/assets/black_logo.png"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Parol-darwin
          path: fyne-cross/dist/darwin/*
