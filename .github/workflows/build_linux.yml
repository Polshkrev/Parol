name: Build and Package Fyne App

on:
  push:
    branches: [ main, dev ]
#   pull_request:
#     branches: [ main, dev ]
#   workflow_dispatch: # Allows manual triggers

jobs:
  build:
    runs-on: linux-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Adjust to match your go.mod
          cache: true

      - name: Install Fyne CLI and Fyne-cross
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          go install github.com/fyne-io/fyne-cross@latest
      - name: Build with Fyne-cross
        run: |
          fyne-cross linux -release -app-id "com.github.parol" -name "myapp" -icon "ui/assets/black_logo.png"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Parol-linux
          path: fyne-cross/dist/linux/*
