name: Build

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.26'
          cache: true

      - name: Make Dist Folder
        run: |
          mkdir dist

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Package with Fyne On Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: 1
        run: |
          fyne package -os windows -release -id "com.github.parol" -name "Parol" -src ${{ github.workspace }}\cmd -icon "${{ github.workspace }}\ui\assets\black_logo.png" -cert windows

      - name: Package with Fyne On Darwin (Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          GOARCH=arm64 fyne package -os darwin -release -id "com.github.parol" -name "Parol-arm64" -src ${{ github.workspace }}/cmd -icon "${{ github.workspace }}/ui/assets/black_logo.png"

      - name: Package with Fyne On Darwin (Intel Silicon)
        if: runner.os == 'macOS'
        run: |
          GOARCH=amd64 fyne package -os darwin -release -id "com.github.parol" -name "Parol-amd64" -src ${{ github.workspace }}/cmd -icon "${{ github.workspace }}/ui/assets/black_logo.png"
          mv *.app dist
      
      - name: Package with Fyne On Linux
        if: runner.os == 'Linux'
        run: |
          fyne package -os linux -release -id "com.github.parol" -name "Parol" -src ${{ github.workspace }}/cmd -icon "${{ github.workspace }}/ui/assets/black_logo.png"
          mv *.xz dist

      - name: Sign Executable
        if: runner.os == 'Windows'
        uses: skymatic/code-sign-action@v1
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        with:
          certificate: ''
          password: signPassword
          certificatesha1: '0416302AB274F2F22BD13482CAFF74E8E554C8A6'
          certificatename: 'Polshkrev'
          folder: '.'
          recursive: false
          description: 'Password Manager.'
          timestampUrl: 'http://timestamp.digicert.com'

      - name: Move Artifact
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERT_BASE64: 
          Move-Item -Path "*/Parol.exe" -Destination dist -Force
          echo $WINDOWS_CERT_BASE64
          echo "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"


      - name: Upload Individual Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Parol-${{ matrix.os }}
          path: ${{ github.workspace }}/dist/*