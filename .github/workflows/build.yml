name: Build and Package Fyne App

on:
  push:
    branches: [ main, dev ]
#   pull_request:
#     branches: [ main, dev ]
#   workflow_dispatch: # Allows manual triggers

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Make Dist Folder
        run: |
          mkdir dist

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Package with Fyne On Windows
        if: runner.os == 'Windows'
        run: |
          fyne package -os windows -release -id "com.github.parol" -name "Parol" -src ${{ github.workspace }}\cmd -icon "${{ github.workspace }}\ui\assets\black_logo.png" -cert windows
          Move-Item -Path "*/Parol.exe" -Destination dist -Force

      - name: Package with Fyne On Darwin
        if: runner.os == 'macOS'
        run: |
          fyne package -os darwin -release -id "com.github.parol" -name "Parol" -src ${{ github.workspace }}/cmd -icon "${{ github.workspace }}/ui/assets/black_logo.png" -cert macos -profile macos
          mv *.app dist

      - name: Package with Fyne On Linux
        if: runner.os == 'Linux'
        run: |
          fyne package -os linux -release -id "com.github.parol" -name "Parol" -src ${{ github.workspace }}/cmd -icon "${{ github.workspace }}/ui/assets/black_logo.png"
          mv *.xz dist
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Parol-${{ matrix.os }}
          path: ${{ github.workspace }}/dist/*

  dist:
    runs-on: ubuntu-latest

    needs: build 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Parol-*
          path: combined-outputs
          merge-multiple: true

      # 3. Upload everything together as a single final artifact
      - name: Upload consolidated final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parol
          path: dist
